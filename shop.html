<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop — Vault</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="site-header">
  <div class="container header-row">
    <a class="logo" href="index.html">Vau<span>lt</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="cartBtn" onclick="toggleCart(true)" aria-label="Cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main class="container section">
  <div class="section-head">
    <div>
      <h2>All products</h2>
      <p>Browse, filter, and sort the catalog.</p>
    </div>
  </div>
  <div class="filters">
    <input id="searchInput" type="search" placeholder="Search products…" />
    <select id="categoryFilter"></select>
    <select id="sortFilter">
      <option value="featured">Featured</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="rating">Top rated</option>
    </select>
  </div>
  <div class="product-grid" id="shopGrid"></div>
</main>

<footer class="site-footer">
  <div class="container">© 2026 Vault Commerce. Built for Day 10 challenge.</div>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Cart">
  <div class="cart-head">
    <h3 style="margin:0">Your cart</h3>
    <button class="icon-btn" onclick="toggleCart(false)" aria-label="Close cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <button class="btn btn-primary" style="width:100%" onclick="toast('Checkout coming soon')">Checkout</button>
  </div>
</aside>

<div class="modal" id="productModal"><div class="modal-card"><div class="modal-body"><div class="modal-img"></div><div class="modal-info"></div></div></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
